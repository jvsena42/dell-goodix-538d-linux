# Dependabot proposes updates as pull requests; nothing is merged
# automatically. It cannot track the libfprint fork in PIN: pin updates are
# manual, audited pull requests (see SECURITY.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
